<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema de Envíos</title><style>body{font-family:system-ui;background:#f4f6f8;margin:0;color:#182230}.w{max-width:1100px;margin:auto;padding:18px}.c{background:#fff;padding:18px;border-radius:12px;margin:12px 0;box-shadow:0 2px 10px #0001}input,textarea,button{box-sizing:border-box;width:100%;padding:11px;margin:5px 0;border:1px solid #ccd2d8;border-radius:8px;font:inherit}button{background:#175cd3;color:#fff;border:0}.hide{display:none}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.muted{color:#667085}</style></head><body><div class="w"><h1>Sistema de Envíos</h1><div id="login" class="c"><h2>Acceso</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button><p id="msg" class="muted"></p></div><div id="app" class="hide"><div class="c"><b id="who"></b> · <span id="role"></span><button onclick="logout()">Cerrar sesión</button></div><div id="newbox" class="c hide"><h2>Nueva solicitud</h2><div class="g"><input id="tracking" placeholder="Nº envío / escanear código"><input id="customer" placeholder="Cliente / destinatario"><input id="location" placeholder="Ubicación física"></div><textarea id="notes" placeholder="Observaciones"></textarea><button onclick="createShipment()">Registrar solicitud</button></div><div class="c"><h2>Envíos</h2><input id="search" placeholder="Buscar envío, cliente, ubicación, recogida o DNI" oninput="render()"><div style="overflow:auto"><table><thead><tr><th>Envío</th><th>Cliente</th><th>Ubicación</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="c"><h2>Cambiar contraseña</h2><input id="newpass" type="password" placeholder="Nueva contraseña"><button onclick="changePassword()">Cambiar contraseña</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
